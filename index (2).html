<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>1tz0l — Cybersecurity</title>
<style>
:root{--green:#16d64b;--ink:#080a09;--muted:#646b67}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;color:var(--ink)}
body{background:#fff;overflow:hidden}
#network{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px}
.hero{display:flex;align-items:center;gap:clamp(26px,4vw,64px);max-width:850px;width:100%;transform:translateY(-1vh)}
.avatar{width:clamp(170px,22vw,280px);aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 22px 45px rgba(0,0,0,.09);display:grid;place-items:center;flex-shrink:0;overflow:hidden}
.avatar svg{width:84%;height:84%;filter:drop-shadow(0 0 12px rgba(22,214,75,.12))}
.info h1{font-family:Arial,Helvetica,sans-serif;font-size:clamp(3.4rem,7vw,6.2rem);line-height:.95;letter-spacing:-.07em;margin:0 0 14px;font-weight:800}
.handle{font-size:clamp(1.1rem,2vw,1.65rem);letter-spacing:.04em;margin-bottom:9px}
.tagline{font-size:clamp(.85rem,1.4vw,1.1rem);color:var(--muted);letter-spacing:.03em}
.links{display:flex;gap:19px;align-items:center;margin-top:28px}
.links a{display:inline-flex;width:29px;height:29px;align-items:center;justify-content:center;color:#080a09;text-decoration:none;transition:transform .2s,color .2s}
.links a:hover{transform:translateY(-3px);color:var(--green)}
.links svg{width:27px;height:27px;fill:currentColor}
.contact{position:fixed;right:28px;bottom:24px;z-index:2;border:1px solid #b7d9c0;border-radius:8px;padding:12px 16px;color:#111;text-decoration:none;background:rgba(255,255,255,.86);font-size:13px;letter-spacing:.01em;transition:border-color .2s,transform .2s}
.contact:hover{border-color:var(--green);transform:translateY(-2px)}
.contact span{color:var(--green);padding-right:9px}
@media(max-width:620px){body{overflow:auto}.hero{flex-direction:column;text-align:center;transform:none;gap:24px;padding:32px 0 80px}.avatar{width:190px}.links{justify-content:center}.contact{right:14px;bottom:14px}.info h1{font-size:3.7rem}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="network" aria-hidden="true"></canvas>
<main>
  <section class="hero" aria-label="Profile">
    <div class="avatar" aria-label="Profile photo"><img src="avatar.png" alt="Profile picture" style="width:100%;height:100%;object-fit:cover;border-radius:50%;"></div>
    <div class="info">
      <h1>AK</h1>
      <div class="handle">1tz0l</div>
      <div class="tagline">cybersecurity / learner</div>
      <nav class="links" aria-label="Social links">
        <a href="https://instagram.com/" aria-label="Instagram" title="Instagram"><svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2.2A2.8 2.8 0 0 0 4.2 7v10A2.8 2.8 0 0 0 7 19.8h10a2.8 2.8 0 0 0 2.8-2.8V7A2.8 2.8 0 0 0 17 4.2H7zm5 3a4.8 4.8 0 1 1 0 9.6 4.8 4.8 0 0 1 0-9.6zm0 2.2a2.6 2.6 0 1 0 0 5.2 2.6 2.6 0 0 0 0-5.2zm5.1-3.7a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2z"/></svg></a>
        <a href="https://linkedin.com/" aria-label="LinkedIn" title="LinkedIn"><svg viewBox="0 0 24 24"><path d="M4 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM3 8h3v13H3zm5 0h3v1.8c.6-1.1 1.8-2.1 3.8-2.1 3.5 0 4.2 2.3 4.2 5.3V21h-3v-7.1c0-1.7-.3-3.1-2.2-3.1-2 0-2.8 1.4-2.8 3.1V21H8z"/></svg></a>
        <a href="https://github.com/1tz0l" aria-label="GitHub" title="GitHub"><svg viewBox="0 0 24 24"><path d="M12 .8a11.2 11.2 0 0 0-3.54 21.83c.56.1.77-.24.77-.54v-2.1c-3.14.68-3.8-1.33-3.8-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.03-.7.08-.69.08-.69 1.14.08 1.74 1.17 1.74 1.17 1.01 1.73 2.65 1.23 3.3.94.1-.73.4-1.23.72-1.52-2.5-.29-5.13-1.25-5.13-5.57 0-1.23.44-2.24 1.16-3.03-.12-.29-.5-1.44.11-3 0 0 .95-.3 3.08 1.16a10.7 10.7 0 0 1 5.6 0c2.14-1.46 3.08-1.16 3.08-1.16.61 1.56.23 2.71.11 3 .72.79 1.16 1.8 1.16 3.03 0 4.33-2.64 5.28-5.15 5.56.41.36.77 1.04.77 2.1v3.09c0 .3.2.65.78.54A11.2 11.2 0 0 0 12 .8z"/></svg></a>
        <a href="https://telegram.org/" aria-label="Telegram" title="Telegram"><svg viewBox="0 0 24 24"><path d="M21.7 3.3 18.4 20c-.25 1.18-.9 1.47-1.82.92l-5.03-3.7-2.43 2.34c-.27.27-.5.5-1.02.5l.36-5.12 9.32-8.42c.4-.36-.09-.56-.62-.2L5.64 13.55.68 12c-1.08-.34-1.1-1.08.23-1.6L20.3 2.8c.9-.33 1.69.22 1.4.5z"/></svg></a>

</main>

<script>
(()=>{const c=document.getElementById('network'),ctx=c.getContext('2d');let w,h,dpr,points=[],mouse={x:-9999,y:-9999},trail=[];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);const count=Math.max(35,Math.min(100,Math.floor(w*h/14500)));points=Array.from({length:count},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,r:Math.random()*1.5+.7,green:Math.random()<.28}));}
function draw(){ctx.clearRect(0,0,w,h);
if(mouse.x>-1000){
  trail.push({x:mouse.x,y:mouse.y,a:1}); if(trail.length>18)trail.shift();
  for(let i=0;i<trail.length;i++){const t=trail[i];t.a*=.91;ctx.beginPath();ctx.arc(t.x,t.y,2+i*.18,0,Math.PI*2);ctx.fillStyle=`rgba(22,214,75,${Math.max(0,t.a*(i/trail.length)*.28)})`;ctx.fill();}
  const glow=ctx.createRadialGradient(mouse.x,mouse.y,1,mouse.x,mouse.y,95);
  glow.addColorStop(0,'rgba(22,214,75,.16)');glow.addColorStop(.45,'rgba(22,214,75,.07)');glow.addColorStop(1,'rgba(22,214,75,0)');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(mouse.x,mouse.y,95,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(mouse.x,mouse.y,10,0,Math.PI*2);ctx.strokeStyle='rgba(22,214,75,.9)';ctx.lineWidth=1.4;ctx.stroke();
  ctx.beginPath();ctx.arc(mouse.x,mouse.y,3,0,Math.PI*2);ctx.fillStyle='#16d64b';ctx.fill();
}
for(const p of points){if(!reduced){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;}let dx=mouse.x-p.x,dy=mouse.y-p.y,dist=Math.hypot(dx,dy);if(dist<160&&dist>0&&!reduced){p.x-=dx/dist*(160-dist)*.028;p.y-=dy/dist*(160-dist)*.028;}}
for(let i=0;i<points.length;i++){const a=points[i];for(let j=i+1;j<points.length;j++){const b=points[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<150){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(60,70,64,${(1-d/150)*.22})`;ctx.lineWidth=.8;ctx.stroke();}}}
for(const p of points){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.green?'rgba(22,214,75,.9)':'rgba(42,55,47,.72)';ctx.fill();}if(!reduced)requestAnimationFrame(draw);}
addEventListener('resize',resize);addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY},{passive:true});addEventListener('pointerleave',()=>{mouse.x=-9999;mouse.y=-9999});resize();draw();})();
</script>
</body>
</html>
